; Set session name globally so all session_start() calls use LMS_SESSION
; This prevents session name mismatch between login and protected pages
session.name = "LMS_SESSION"

; Upload/processing budget for team registration (documents are large).
; PHP-FPM (production) reads this file; Apache mod_php (local XAMPP) ignores
; .user.ini, so the same values are mirrored in .htaccess.
; NOTE: post_max_size cannot be changed from .user.ini — it is set in
; fpm_custom.conf, which the Procfile passes to heroku-php-apache2 with -F.
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
upload_max_filesize = 12M

