; PHP-FPM settings that .user.ini cannot change on Heroku.
; Passed to the web server by the Procfile:
;   web: vendor/bin/heroku-php-apache2 -F fpm_custom.conf
; Reference: https://devcenter.heroku.com/articles/custom-php-settings
;
; Team registration uploads a team image plus one document per player, and the
; per-file validation allows 10 MB. The Heroku PHP defaults (2M/8M) silently
; discarded those uploads, which surfaced in the browser as "Failed to fetch".
php_value[post_max_size]=60M
php_value[upload_max_filesize]=12M
php_value[max_file_uploads]=40
php_value[max_execution_time]=120
php_value[max_input_time]=120
php_value[memory_limit]=256M
